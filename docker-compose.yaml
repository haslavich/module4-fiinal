version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    tty: true
    stdin_open: true

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
        - "6379:6379"
        - "8001:8001"
    volumes:
        - redis_data:/data
    networks:
        - app_network
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
   driver: bridge